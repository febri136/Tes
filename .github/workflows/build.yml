name: Build postmarketOS for Amlogic S905X4 (Devmfc Kernel GNOME)

on:
  workflow_dispatch: # Memicu build secara manual lewat tab Actions
  schedule:
    - cron: '0 2 * * 5' # Otomatis build setiap hari Jumat jam 02:00 UTC

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 openssl

      - name: Set up QEMU
        # Modul resmi QEMU untuk menjamin kelancaran emulasi silang paket ARM64 di server GitHub
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install pmbootstrap from Official Git
        run: |
          # Mengunduh langsung repositori pmbootstrap ke root pangkalan kerja
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          
          # Mendaftarkan folder bin lokal dan membuat symlink yang sah dari root workspace
          mkdir -p ~/.local/bin
          ln -s "$GITHUB_WORKSPACE/pmbootstrap/pmbootstrap.py" ~/.local/bin/pmbootstrap
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify pmbootstrap Installation
        run: |
          # Perintah global pmbootstrap siap digunakan
          pmbootstrap --version

      - name: Generate pmbootstrap v3 Configuration File
        run: |
          # SELESAIKAN GERBANG INTERAKTIF: Mendapatkan otentikasi folder kerja orisinal secara sah
          yes "" | pmbootstrap --as-root init || true
          
          # SOLUSI UTAMA LOG ERR: Mengubah kernel menjadi 'amlogic' agar lolos dari validasi ketat pmaports hulu
          cat <<EOF > ~/.config/pmbootstrap_v3.cfg
          [pmbootstrap]
          version = 3
          aports = /home/runner/.local/var/pmbootstrap/cache_git/pmaports
          work = /home/runner/.local/var/pmbootstrap
          jobs = 4
          ccache_size = 5G
          channel = edge
          device = amlogic-aarch64-tvbox
          kernel = amlogic
          ui = gnome
          user = user
          lang = en_US.UTF-8
          timezone = UTC
          hostname = pmos-s905x4
          is_default_channel = False
          [mirrors]
          mirrors.alpine = http://alpinelinux.org
          mirrors.pmaports = http://postmarketos.org
          EOF
          
          # PENYELARASAN TARGET PERANGKAT: Memaksa konfigurasi awal menerima profil penamaan kernel hulu yang valid
          pmbootstrap --as-root config device amlogic-aarch64-tvbox
          pmbootstrap --as-root config kernel amlogic
          pmbootstrap --as-root config ui gnome

      - name: Zap and Pull Mainline Packages
        run: |
          # Menginisialisasi folder kerja secara otomatis dan sah dengan flag '--as-root' dan detail log aktif
          pmbootstrap --as-root --details-to-stdout zap
          
          # Memperbarui pmaports menggunakan eksekusi langsung pmbootstrap global
          pmbootstrap --as-root --details-to-stdout pull

      - name: Inject Devmfc Custom Kernel Source
        run: |
          # JALUR KUSTOM KERNEL DISKUSI: Menuju direktori kemasan pembuatan paket kernel amlogic hulu
          TARGET_DIR="/home/runner/.local/var/pmbootstrap/cache_git/pmaports/device/testing/linux-postmarketos-amlogic"
          cd $TARGET_DIR
          
          echo "=== Menimpa Cetak Biru APKBUILD ke Repositori Git Devmfc ==="
          # PERBAIKAN REVISI: Mengembalikan alamat URL repositori penuh milik devmfc agar pengunduhan tidak gagal
          sed -i 's|_giturl=.*|_giturl="https://github.com"|g' APKBUILD
          
          # PERBAIKAN RILIS TERBARU: Menyesuaikan branch pengompilan mengikuti versi stabil v6.18 milik devmfc
          sed -i 's|_gitbranch=.*|_gitbranch="amlogic-6.18"|g' APKBUILD
          
          echo "=== Memperbarui Berkas Checksum Manifest Paket ==="
          # Melakukan generate ulang kode hash pengaman karena berkas sumber hulu telah dimanipulasi secara paksa
          pmbootstrap --as-root checksum linux-postmarketos-amlogic

      - name: Build Rootfs Image
        run: |
          # Memulai perakitan citra dengan kernel kustom devmfc, tanpa opsi enkripsi hulu, dan tanpa flag --arch ilegal
          pmbootstrap --as-root --details-to-stdout install --no-fde --password 147147

      - name: Export Deployment Images
        run: |
          # Mengeksekusi perintah murni v3 tanpa parameter flag --output yang dilarang hulu
          pmbootstrap --as-root export

      - name: Upload Artifacts
        # Memastikan berkas citra sistem ter-upload dengan aman ke artefak GitHub
        uses: actions/upload-artifact@v4
        with:
          name: postmarketOS-amlogic-s905x4-devmfc-gnome
          path: /tmp/postmarketOS-export/*.img*
          retention-days: 7
